services:
  - type: web
    name: healthbot-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python ingest.py
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: RELEVANCE_THRESHOLD
        value: "50.014"
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: RATE_LIMIT_PER_MIN
        value: "15"
      - key: CHROMA_DIR
        value: "./chroma_db"
      - key: LOG_DB
        value: "./query_log.db"
      - key: CORS_ORIGINS
        value: "*"
    # Note on Persistent Disk Storage:
    # If using Render Starter plan ($7/mo) or higher, persistent disks can be attached
    # by adding the following block (disks are not supported on Render Free tier):
    # disk:
    #   name: healthbot-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # And updating CHROMA_DIR to /var/data/chroma_db and LOG_DB to /var/data/query_log.db
